services:
  postgres:
    image: postgres:16-alpine
    container_name: student_jobs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-student_jobs}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-student_jobs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: student_jobs_server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-student_jobs}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_job_sv_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      REQUIRE_EMPLOYER_APPROVAL: ${REQUIRE_EMPLOYER_APPROVAL:-false}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: student_jobs_client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://server:5000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
